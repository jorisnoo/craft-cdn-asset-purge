name: Package CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, dom, gd, intl, mbstring, pdo_sqlite, zip
          coverage: none
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M
      - run: vendor/bin/pest

  checks:
    name: Package checks
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() }}
    steps:
      - run: test "$TEST_RESULT" = success
        env:
          TEST_RESULT: ${{ needs.test.result }}
